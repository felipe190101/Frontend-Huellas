<header class="navbar">
  <div class="container">
    <div class="logo">
      <a routerLink="/"><img src="/img/logo.png" alt="Logo Huellas & Legados"></a>
    </div>

    <button class="menu-toggle" (click)="toggleMenu()">☰</button>

    <nav class="nav-links" [class.active]="menuOpen">
      <ng-container *ngIf="autenticado && usuario?.nombre_rol === 'admin'; else usuarioNoAdmin">
        <span class="usuario">👋 Bienvenido {{ usuario?.nombre }} {{ usuario?.apellido }}</span>
        <a routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
        <a routerLink="/admin/planes" routerLinkActive="active">Planes</a>
        <a routerLink="/admin/auditoria" routerLinkActive="active">Auditoría</a>
        <button (click)="logout()">Cerrar sesión</button>
      </ng-container>

      <ng-template #usuarioNoAdmin>
        <ng-container *ngIf="autenticado && (usuario?.nombre_rol === 'beneficiario' || usuario?.rol === 'beneficiario'); else titular">
          <span class="usuario">👋 Bienvenido {{ usuario?.nombre }} {{ usuario?.apellido }}</span>
          <button (click)="logout()">Cerrar sesión</button>
        </ng-container>
      </ng-template>

      <ng-template #titular>
        <ng-container *ngIf="autenticado; else sinSesion">
          <span class="usuario">👋 Bienvenido {{ usuario?.nombre }} {{ usuario?.apellido }}</span>
          <a routerLink="/archivos" routerLinkActive="active" (click)="closeMenu()">📂 Mis Archivos</a>
          <a routerLink="/planes" routerLinkActive="active" (click)="closeMenu()">Planes</a>
          <a routerLink="/beneficiarios" routerLinkActive="active" (click)="closeMenu()">Beneficiarios</a>
          <a routerLink="/perfil" routerLinkActive="active" (click)="closeMenu()">Mi perfil</a>
          <button (click)="logout()">Cerrar sesión</button>
        </ng-container>
      </ng-template>

      <ng-template #sinSesion>
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Inicio</a>
        <a routerLink="/planes" routerLinkActive="active" (click)="closeMenu()">Planes</a>
        <a routerLink="/nosotros" routerLinkActive="active" (click)="closeMenu()">Nosotros</a>
        <a routerLink="/contacto" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
        <button routerLink="/login" (click)="closeMenu()">Iniciar sesión</button>
        <button routerLink="/registro" (click)="closeMenu()">Registrarse</button>
      </ng-template>
    </nav>
  </div>
</header>
