<main class="login-container">
  <section class="login-card">
    <header class="login-encabezado">
      <div class="marca-icono">H</div>
      <div><p class="eyebrow">Huellas & Legados</p><h1>Bienvenido de nuevo</h1><p>Ingresa para continuar cuidando tu historia y tu legado.</p></div>
    </header>

    <div class="tipo-acceso" role="group" aria-label="Tipo de acceso">
      <button type="button" [class.activo]="tipoAcceso === 'titular'" (click)="cambiarTipoAcceso('titular')"><span>👤</span>Titular</button>
      <button type="button" [class.activo]="tipoAcceso === 'beneficiario'" (click)="cambiarTipoAcceso('beneficiario')"><span>🤝</span>Beneficiario</button>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group"><label for="identificador">{{ etiquetaIdentificador }}</label><input id="identificador" [type]="tipoAcceso === 'titular' ? 'email' : 'text'" [(ngModel)]="credenciales.correo" name="identificador" [placeholder]="placeholderIdentificador" required autocomplete="username" /></div>
      <div class="form-group"><div class="label-fila"><label for="contrasena">Contraseña</label></div><input id="contrasena" type="password" [(ngModel)]="credenciales.contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required autocomplete="current-password" /></div>
      <button type="submit" class="btn-login">Iniciar sesión <span>→</span></button>
    </form>

    <div class="extra-links" *ngIf="tipoAcceso === 'beneficiario'"><p>¿Aún no activas tu cuenta? Usa el enlace enviado por el titular.</p></div>
    <div class="extra-links" *ngIf="tipoAcceso === 'titular'"><p>¿Aún no tienes cuenta? <a routerLink="/registro">Crear una cuenta</a></p></div>
  </section>
</main>
